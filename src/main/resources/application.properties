spring.application.name=graphed
server.port=${PORT:8080}

# CognoDB connection - never hard-code these; always injected via environment
# variables so credentials never enter source control.
#   COGNODB_URI      e.g. bolt+s://db-cd1d4f7d.bravo.databases.cognodb.com:7687
#   COGNODB_USERNAME  e.g. cognodb
#   COGNODB_PASSWORD  the password shown once when the instance was created
cognodb.uri=${COGNODB_URI:bolt://localhost:7687}
cognodb.username=${COGNODB_USERNAME:neo4j}
cognodb.password=${COGNODB_PASSWORD:password}

# Keep stack traces out of API error bodies (GlobalExceptionHandler formats them)
server.error.include-stacktrace=never
